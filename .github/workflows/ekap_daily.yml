# Zamanlanmış sabah bülteni (her gün 09:00 Türkiye saati) + elle tetikleme.
# Projenin zamanlanmış tek workflow'u burasıdır; ekap-daily-digest.yml elle
# tetiklenir. İkisini birden zamanlamayın, aynı sabah iki bülten gider.
#
# Liste https://ihale.surucu.dev/mcp üzerinden gelir (IHALE_MCP_URL).
# Sunucu Turnstile'ı geçemezse ve EKAP_FALLBACK=1 ise kaynak ilan.gov.tr olur.
# Runner her seferinde silinir. data/ekap.db Actions cache'de durmazsa her
# sabah "ilk tarama" sayılır ve bülten gönderilmez. Cache boşsa ilk çalışma
# yine tohumdur; ertesi sabah yalnızca yeni ilanlar gider.
# Secrets veya Variables (Settings → Secrets and variables → Actions):
#   ENTROPY_EMAIL_API_KEY  → MSA API (gönderen: info@entropywork.com)
#   EKAP_EMAIL_RECIPIENTS veya RECEIVER_MAILS → virgülle alıcılar
# Yedek SMTP: SENDER_MAIL, SENDER_PASSWORD
# Google Takvim API'ye otomatik etkinlik yazılmaz.
# Kullanıcı maildeki "📅 Takvime Ekle" bağlantısıyla kendi takvimine ekler.

name: EKAP Daily Digest

on:
  schedule:
    # GitHub cron UTC çalışır; Türkiye yıl boyunca UTC+3 olduğu için
    # 06:00 UTC = 09:00 Türkiye saati.
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  scrape-and-mail:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      actions: write
      contents: read
    env:
      ENTROPY_EMAIL_API_URL: https://msa.entropywork.com/api/send-email
      ENTROPY_EMAIL_API_KEY: ${{ secrets.ENTROPY_EMAIL_API_KEY }}
      ENTROPY_EMAIL_FROM: info@entropywork.com
      SENDER_MAIL: ${{ secrets.SENDER_MAIL || vars.SENDER_MAIL }}
      SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD || vars.SENDER_PASSWORD }}
      EKAP_EMAIL_RECIPIENTS: ${{ secrets.EKAP_EMAIL_RECIPIENTS || vars.EKAP_EMAIL_RECIPIENTS || secrets.RECEIVER_MAILS || vars.RECEIVER_MAILS }}
      RECEIVER_MAILS: ${{ secrets.RECEIVER_MAILS || vars.RECEIVER_MAILS || secrets.EKAP_EMAIL_RECIPIENTS || vars.EKAP_EMAIL_RECIPIENTS }}
      SAYFA_LIMITI: "2"
      EKAP_FALLBACK: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Restore seen tenders
        uses: actions/cache/restore@v4
        with:
          path: data/ekap.db
          key: ekap-seen-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ekap-seen-

      - name: Run EKAP cron bot
        run: python cron_bot.py

      - name: Checkpoint seen database
        id: ekap-db
        if: always()
        run: |
          if [ ! -f data/ekap.db ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python -c "import sqlite3; c=sqlite3.connect('data/ekap.db'); c.execute('PRAGMA wal_checkpoint(TRUNCATE)'); c.close()"
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Save seen tenders
        if: always() && steps.ekap-db.outputs.ready == 'true'
        uses: actions/cache/save@v4
        with:
          path: data/ekap.db
          key: ekap-seen-${{ github.run_id }}-${{ github.run_attempt }}
