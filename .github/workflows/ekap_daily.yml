# Elle tetiklenen Selenium tarama + sabah bülteni.
# Secrets veya Variables (Settings → Secrets and variables → Actions):
#   ENTROPY_EMAIL_API_KEY  → MSA API (gönderen: info@entropywork.com)
#   EKAP_EMAIL_RECIPIENTS veya RECEIVER_MAILS → virgülle alıcılar
# Yedek SMTP: SENDER_MAIL, SENDER_PASSWORD
# Google Takvim API'ye otomatik etkinlik yazılmaz.
# Kullanıcı maildeki "📅 Takvime Ekle" bağlantısıyla kendi takvimine ekler.

name: EKAP Daily Selenium Digest

on:
  workflow_dispatch:

jobs:
  scrape-and-mail:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ENTROPY_EMAIL_API_URL: https://msa.entropywork.com/api/send-email
      ENTROPY_EMAIL_API_KEY: ${{ secrets.ENTROPY_EMAIL_API_KEY }}
      ENTROPY_EMAIL_FROM: info@entropywork.com
      SENDER_MAIL: ${{ secrets.SENDER_MAIL || vars.SENDER_MAIL }}
      SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD || vars.SENDER_PASSWORD }}
      EKAP_EMAIL_RECIPIENTS: ${{ secrets.EKAP_EMAIL_RECIPIENTS || vars.EKAP_EMAIL_RECIPIENTS || secrets.RECEIVER_MAILS || vars.RECEIVER_MAILS }}
      RECEIVER_MAILS: ${{ secrets.RECEIVER_MAILS || vars.RECEIVER_MAILS || secrets.EKAP_EMAIL_RECIPIENTS || vars.EKAP_EMAIL_RECIPIENTS }}
      SAYFA_LIMITI: "2"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable

      - name: Install xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run EKAP cron bot
        run: xvfb-run -a python cron_bot.py
