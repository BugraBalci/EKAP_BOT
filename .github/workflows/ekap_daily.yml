# Her sabah 08:30 Türkiye (UTC+3) — EKAP v2 API (ihale-mcp) + sabah bülteni.
# Secrets veya Variables (Settings → Secrets and variables → Actions):
#   ENTROPY_EMAIL_API_KEY  → MSA API (gönderen: info@entropywork.com)
#   EKAP_EMAIL_RECIPIENTS veya RECEIVER_MAILS → virgülle alıcılar
# Yedek SMTP: SENDER_MAIL, SENDER_PASSWORD
# Google Takvim (calendar_sync.py) — Run adımı env:
#   GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
#   GOOGLE_CALENDAR_ID: ${{ secrets.GOOGLE_CALENDAR_ID }}
#   AUTO_SYNC_CALENDAR: vars.AUTO_SYNC_CALENDAR (varsayılan false)
#   Takvimi service account e-postası ile "Etkinlikleri değiştirme" yetkisiyle paylaşın.

name: EKAP Daily API Digest

on:
  schedule:
    # 05:30 UTC = 08:30 Europe/Istanbul (Türkiye DST kullanmıyor)
    - cron: "30 5 * * *"
  workflow_dispatch:

jobs:
  scrape-and-mail:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ENTROPY_EMAIL_API_URL: https://msa.entropywork.com/api/send-email
      ENTROPY_EMAIL_API_KEY: ${{ secrets.ENTROPY_EMAIL_API_KEY }}
      ENTROPY_EMAIL_FROM: info@entropywork.com
      SENDER_MAIL: ${{ secrets.SENDER_MAIL || vars.SENDER_MAIL }}
      SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD || vars.SENDER_PASSWORD }}
      EKAP_EMAIL_RECIPIENTS: ${{ secrets.EKAP_EMAIL_RECIPIENTS || vars.EKAP_EMAIL_RECIPIENTS || secrets.RECEIVER_MAILS || vars.RECEIVER_MAILS }}
      RECEIVER_MAILS: ${{ secrets.RECEIVER_MAILS || vars.RECEIVER_MAILS || secrets.EKAP_EMAIL_RECIPIENTS || vars.EKAP_EMAIL_RECIPIENTS }}
      SAYFA_LIMITI: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.3"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Clone ihale-mcp vendor
        run: |
          git clone --depth 1 https://github.com/saidsurucu/ihale-mcp vendor/ihale-mcp
          uv sync --python 3.12 --directory vendor/ihale-mcp

      - name: Run EKAP cron bot
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_CALENDAR_ID: ${{ secrets.GOOGLE_CALENDAR_ID }}
          AUTO_SYNC_CALENDAR: ${{ vars.AUTO_SYNC_CALENDAR || 'false' }}
        run: python cron_bot.py
