# Elle tetiklenen özet (Entropy MSA mail) — Selenium / headless Chrome.
# Zamanlanmış günlük bülten (SMTP): .github/workflows/ekap_daily.yml
# Secrets (Settings → Secrets and variables → Actions):
#   ENTROPY_EMAIL_API_KEY  → MSA API key
#   EKAP_EMAIL_RECIPIENTS  → virgülle alıcılar (örn: a@x.com,b@y.com)

name: EKAP Daily Digest (Selenium, manual)

on:
  workflow_dispatch:
    inputs:
      recipients:
        description: "Alıcılar (boşsa secret EKAP_EMAIL_RECIPIENTS kullanılır)"
        required: false
        default: ""
      okas:
        description: "OKAS kodu (virgülle birden fazla)"
        required: false
        default: "32230000,32220000,32510000,32524000,32552420,32552110,32552430,32573000,32420000,32410000,32430000,64215000,64212000,64216210,64216100,64216200,64216120,64216110,72700000,72200000,72400000,72300000,72800000,72910000"

jobs:
  send-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Google Chrome
        run: |
          set -euo pipefail
          wget -q -O /tmp/google-chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt-get update
          sudo apt-get install -y /tmp/google-chrome.deb
          google-chrome --version

      - name: Install Python dependencies
        run: pip install selenium webdriver-manager pandas

      - name: Send daily digest
        env:
          ENTROPY_EMAIL_API_URL: https://msa.entropywork.com/api/send-email
          ENTROPY_EMAIL_API_KEY: ${{ secrets.ENTROPY_EMAIL_API_KEY }}
          EKAP_EMAIL_RECIPIENTS: ${{ secrets.EKAP_EMAIL_RECIPIENTS }}
        run: |
          set -euo pipefail
          TO="${{ github.event.inputs.recipients }}"
          OKAS="${{ github.event.inputs.okas }}"
          OKAS="${OKAS:-32230000,32220000,32510000,32524000,32552420,32552110,32552430,32573000,32420000,32410000,32430000,64215000,64212000,64216210,64216100,64216200,64216120,64216110,72700000,72200000,72400000,72300000,72800000,72910000}"
          if [ -n "${TO}" ]; then
            python3 daily_digest.py --okas "$OKAS" --haric "lisans, araba" --limit 2 --to "$TO"
          else
            python3 daily_digest.py --okas "$OKAS" --haric "lisans, araba" --limit 2
          fi
