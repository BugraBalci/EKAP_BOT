# Elle tetiklenen EKAP özeti (Entropy MSA mail).
# Zamanlanmış günlük bülten: .github/workflows/ekap_daily.yml
# Secrets (Settings → Secrets and variables → Actions):
#   ENTROPY_EMAIL_API_KEY  → MSA API key (gönderen: info@entropywork.com)
#   EKAP_EMAIL_RECIPIENTS  → virgülle alıcılar (örn: a@x.com,b@y.com)
# Google Takvim API'ye otomatik etkinlik yazılmaz; maildeki Takvime Ekle kullanılır.

name: EKAP Daily Digest (manual)

on:
  workflow_dispatch:
    inputs:
      recipients:
        description: "Alıcılar (boşsa secret EKAP_EMAIL_RECIPIENTS kullanılır)"
        required: false
        default: ""
      okas:
        description: "OKAS kodu (virgülle birden fazla)"
        required: false
        default: "32230000,32220000,32510000,32524000,32552420,32552110,32552430,32573000,32420000,32410000,32430000,64215000,64212000,64216210,64216100,64216200,64216120,64216110,72700000,72200000,72400000,72300000,72800000,72910000,31711000"

jobs:
  send-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      actions: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Restore seen tenders
        uses: actions/cache/restore@v4
        with:
          path: data/ekap.db
          key: ekap-seen-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ekap-seen-

      - name: Send daily digest
        env:
          ENTROPY_EMAIL_API_URL: https://msa.entropywork.com/api/send-email
          ENTROPY_EMAIL_API_KEY: ${{ secrets.ENTROPY_EMAIL_API_KEY }}
          ENTROPY_EMAIL_FROM: info@entropywork.com
          EKAP_EMAIL_RECIPIENTS: ${{ secrets.EKAP_EMAIL_RECIPIENTS }}
          EKAP_FALLBACK: "1"
        run: |
          set -euo pipefail
          TO="${{ github.event.inputs.recipients }}"
          OKAS="${{ github.event.inputs.okas }}"
          OKAS="${OKAS:-32230000,32220000,32510000,32524000,32552420,32552110,32552430,32573000,32420000,32410000,32430000,64215000,64212000,64216210,64216100,64216200,64216120,64216110,72700000,72200000,72400000,72300000,72800000,72910000,31711000}"
          if [ -n "${TO}" ]; then
            python3 daily_digest.py --okas "$OKAS" --haric "lisans, araba" --limit 2 --to "$TO"
          else
            python3 daily_digest.py --okas "$OKAS" --haric "lisans, araba" --limit 2
          fi

      - name: Checkpoint seen database
        id: ekap-db
        if: always()
        run: |
          if [ ! -f data/ekap.db ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python -c "import sqlite3; c=sqlite3.connect('data/ekap.db'); c.execute('PRAGMA wal_checkpoint(TRUNCATE)'); c.close()"
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Save seen tenders
        if: always() && steps.ekap-db.outputs.ready == 'true'
        uses: actions/cache/save@v4
        with:
          path: data/ekap.db
          key: ekap-seen-${{ github.run_id }}-${{ github.run_attempt }}
